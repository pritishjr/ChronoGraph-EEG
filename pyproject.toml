[project]
name = "chronograph-seizure"
version = "0.1.0"
description = "Dynamic graph learning tools for seizure analysis from EEG"
readme = "README.md"
authors = [
    { name = "pritishjr", email = "pritishjr.personal@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "mne>=1.12.1",
    "networkx>=3.6.1",
    "pyyaml>=6.0",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    "torch-geometric>=2.8.0.post1",
]

[project.scripts]
chronograph = "chronograph:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
